<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamento concluído | Portal do Colaborador</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <header class="topo">
      <span class="marca">Andrade Visa Consultancy · Sua Ponte Segura</span>
      <span class="marca">Portal do Colaborador</span>
    </header>

    <section class="cabecalho-equipe">
      <div class="selo">
        <div class="selo__conteudo">
          <div class="selo__equipe">Concluído</div>
          <div class="selo__rotulo">✓</div>
        </div>
      </div>
      <div>
        <h1>Treinamento <span class="destaque-bege">concluído</span></h1>
        <p>Você concluiu o treinamento <strong id="tituloModulo">este módulo</strong>, da equipe <strong id="nomeEquipe"></strong>.</p>
      </div>
    </section>

    <div class="material-rodape-acoes">
      <a class="botao" id="botaoVoltar" href="index.html">← Voltar aos treinamentos</a>
      <a class="botao botao--secundario" href="index.html">Ir para a página inicial</a>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var titulo = params.get('titulo');
      var equipe = params.get('equipe');
      var voltar = params.get('voltar');

      if (titulo) {
        document.getElementById('tituloModulo').textContent = '"' + titulo + '"';
      }
      if (equipe) {
        document.getElementById('nomeEquipe').textContent = equipe;
      }
      if (voltar) {
        document.getElementById('botaoVoltar').setAttribute('href', voltar);
      }
    })();
  </script>
  <script src="assets/protecao.js"></script>
</body>
</html>
